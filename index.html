<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="menu">
      <ul>
        <li class="profile">
          <div class="img-box">
            <img src="img/akram img.jpeg" alt="profile" />
          </div>
          <h2>Akram</h2>
        </li>
        <li>
          <a class="active" href="#"
            ><i class="fas fa-home"></i>
            <p>Dashboard</p>
          </a>
        </li>
        <li>
          <a href="#"
            ><i class="fas fa-user-group"></i>
            <p>clints</p>
          </a>
        </li>
        <li>
          <a href="#"
            ><i class="fas fa-table"></i>
            <p>products</p>
          </a>
        </li>
        <li>
          <a href="#"
            ><i class="fas fa-chart-pie"></i>
            <p>Charts</p>
          </a>
        </li>
        <li>
          <a href="#"
            ><i class="fas fa-pen"></i>
            <p>posts</p>
          </a>
        </li>
        <li>
          <a href="#"
            ><i class="fas fa-star"></i>
            <p>favorite</p>
          </a>
        </li>
        <li>
          <a href="#"
            ><i class="fas fa-cog"></i>
            <p>settings</p>
          </a>
        </li>
        <li class="log-out">
          <a href="#"
            ><i class="fas fa-sign-out"></i>
            <p>logout</p>
          </a>
        </li>
      </ul>
    </div>

    <div class="content">
      <div class="title-info">
        <p>dashboard</p>
        <i class="fas fa-chart-bar"></i>
      </div>
      <div class="data-info">
       
        <div class="box">
          <i class="fas fa-user"></i>
          <div class="data">
            <p>user</p>
            <span>100</span>
          </div>
        </div>
        <div class="box">
          <i class="fas fa-pen"></i>
          <div class="data">
            <p>posts</p>
            <span>65</span>
          </div>
        </div>
        <div class="box">
          <i class="fas fa-table"></i>
          <div class="data">
            <p>products</p>
            <span>66</span>
          </div>
        </div>
        <div class="box">
            <i class="fas fa-dollar"></i>
            <div class="data">
                <p>revenue</p>
                <span>$100</span>
            </div>
        </div>
      </div>
      <div class="title-info">
        <p>products</p>
        <i class="fas fa-table"></i>
      </div>

      <div class="add-section">
        <input id="title" class="inp" type="text">
        <input id="price" class="inp" type="number">
        <input id="count" class="inp" type="number">
        <button onclick="createPro(); showData()" id="add" class="btn">add product</button>
        <button onclick="deletePro()" id="del" class="btn">delete product</button>

      
      </div>

<table>
    <thead>
        <tr>
            <th>product</th>
            <th>price</th>
            <th>count</th>
        </tr>
    </thead>
    <tbody id="tbody">
    
     </tbody>
</table>


    </div>
    <script src="main.js"></script>
  </body>
</html>
